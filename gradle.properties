# Gradle 8.x does not support Java 25, which is what JAVA_HOME points at on this
# machine. Pinning the daemon to JDK 21 keeps the build working from both the
# command line and IntelliJ. Forward slashes avoid properties-file escaping.
org.gradle.java.home=C:/Program Files/Java/jdk-21
org.gradle.jvmargs=-Xmx2G
